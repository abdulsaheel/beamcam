name: beamcam
description: "Phone-as-webcam: Flutter sender + macOS receiver feeding a CoreMediaIO virtual camera."
publish_to: 'none'
version: 1.0.0+3

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  flutter_webrtc: ^1.6.0
  qr_flutter: ^4.1.0
  shared_preferences: ^2.5.5
  nsd: ^5.0.1
  app_links: ^7.2.1
  url_launcher: ^6.3.2
  package_info_plus: ^10.2.1
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/logo-light.png
    - assets/logo-dark.png
